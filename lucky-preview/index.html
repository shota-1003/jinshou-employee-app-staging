<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ラッキー賞 演出プレビュー(テスト)</title>
<style>
:root{--line:#e5e5e5;--text-faint:#7a7a7a;--primary:#c9a227;--danger:#d9534f;--success:#2e7d32;--warning:#e0a021;--surface-2:#1b2440;}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#0e1526;color:#eef2ff;-webkit-tap-highlight-color:transparent;}
.wrap{max-width:420px;margin:0 auto;padding:20px 16px 40px;}
.title{font-size:20px;font-weight:800;margin:8px 0 4px;}
.note{font-size:13px;color:#aab4d4;margin-bottom:18px;line-height:1.6;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.pbtn{padding:20px 10px;border-radius:14px;border:1px solid rgba(255,255,255,.18);font-size:16px;font-weight:800;color:#fff;cursor:pointer;background:#1b2440;}
.pbtn small{display:block;font-size:11px;font-weight:600;opacity:.75;margin-top:4px;}
.pbtn.b1{background:linear-gradient(135deg,#2f6bd6,#1e5bd6);}
.pbtn.b2{background:linear-gradient(135deg,#caa100,#a37f00);}
.pbtn.b3{background:linear-gradient(135deg,#0e9e6e,#0a7d57);}
.pbtn.b5{background:linear-gradient(135deg,#d61e2f,#a3121f);}
.pbtn.b10{background:linear-gradient(90deg,#ff004c,#ff8a00,#ffe600,#22d36b,#00b3ff,#8a2be2);color:#111;}
.pbtn.bh{background:#111;color:#f5d76e;border-color:#c9a227;}
.foot{margin-top:22px;font-size:12px;color:#8894b8;line-height:1.7;}

/* ===== 当選演出(社員ポータル本体と同一) ===== */
.lucky-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0b1020;color:#fff;text-align:center;}
.lucky-overlay.theme-blue{background:radial-gradient(circle at 50% 40%,#1e5bd6,#0a1f4d 70%);}
.lucky-overlay.theme-gold{background:radial-gradient(circle at 50% 40%,#caa100,#4a3600 70%);}
.lucky-overlay.theme-green{background:radial-gradient(circle at 50% 40%,#0e9e6e,#053b2a 70%);}
.lucky-overlay.theme-red{background:radial-gradient(circle at 50% 40%,#d61e2f,#3a0308 72%);}
.lucky-overlay.theme-rainbow{background:conic-gradient(from 0deg,#ff004c,#ff8a00,#ffe600,#22d36b,#00b3ff,#8a2be2,#ff004c);animation:luckyRainbowSpin 6s linear infinite;}
.lucky-overlay.theme-hotel{background:radial-gradient(circle at 50% 45%,#3a2f10,#000 70%);}
@keyframes luckyRainbowSpin{to{filter:hue-rotate(360deg);}}
.lucky-overlay.dim{background:#000 !important;transition:background .4s;}
.lucky-stage{position:relative;z-index:2;padding:24px;opacity:0;transform:scale(.8);animation:luckyPop .6s .1s forwards cubic-bezier(.2,1.4,.4,1);}
@keyframes luckyPop{to{opacity:1;transform:scale(1);}}
.lucky-badge{font-size:34px;font-weight:900;letter-spacing:4px;text-shadow:0 0 18px rgba(255,255,255,.7);margin-bottom:10px;}
.lucky-amount{font-size:64px;font-weight:900;line-height:1;margin:8px 0;text-shadow:0 4px 24px rgba(0,0,0,.5);}
.lucky-winner{font-size:22px;font-weight:700;margin-top:14px;}
.lucky-sub{font-size:14px;opacity:.85;margin-top:10px;}
.lucky-overlay.theme-rainbow .lucky-amount{background:linear-gradient(90deg,#ff004c,#ffe600,#22d36b,#00b3ff,#8a2be2);-webkit-background-clip:text;background-clip:text;color:transparent;animation:luckyRainbowText 2s linear infinite;background-size:200% auto;}
@keyframes luckyRainbowText{to{background-position:200% center;}}
.lucky-overlay.theme-hotel .lucky-badge{color:#f5d76e;letter-spacing:6px;}
.lucky-overlay.theme-hotel .lucky-amount{font-size:30px;color:#f5d76e;text-shadow:0 0 22px rgba(245,215,110,.8);}
.lucky-flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:3;pointer-events:none;}
.lucky-flash.go{animation:luckyFlash .5s ease-out;}
@keyframes luckyFlash{0%{opacity:0;}15%{opacity:.95;}100%{opacity:0;}}
.lucky-ring{position:absolute;inset:6px;border:3px solid rgba(255,255,255,0);border-radius:20px;z-index:1;}
.lucky-overlay.theme-green .lucky-ring{border-color:rgba(80,255,180,.6);box-shadow:0 0 30px rgba(80,255,180,.5) inset;animation:luckyRingRun 1.6s linear infinite;}
@keyframes luckyRingRun{50%{box-shadow:0 0 60px rgba(80,255,180,.8) inset;}}
.lucky-close{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:5;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:24px;padding:10px 28px;font-size:15px;cursor:pointer;}
.lucky-confetti{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.lucky-piece{position:absolute;top:-12px;width:9px;height:14px;opacity:.95;will-change:transform;animation:luckyFall linear forwards;}
@keyframes luckyFall{to{transform:translateY(105vh) rotate(720deg);}}
.lucky-doors{position:absolute;inset:0;z-index:4;display:flex;pointer-events:none;}
.lucky-door{flex:1;background:linear-gradient(#1a1204,#000);border:1px solid #3a2f10;}
.lucky-door.l{transform-origin:left;}.lucky-door.r{transform-origin:right;}
.lucky-doors.open .lucky-door.l{animation:luckyDoorL 1.1s ease-in forwards;}
.lucky-doors.open .lucky-door.r{animation:luckyDoorR 1.1s ease-in forwards;}
@keyframes luckyDoorL{to{transform:perspective(800px) rotateY(105deg);}}
@keyframes luckyDoorR{to{transform:perspective(800px) rotateY(-105deg);}}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">🎁 ラッキー賞 演出プレビュー</div>
  <div class="note">テスト用のプレビューです。ボタンを押すと、実際の当選時と同じ全画面演出を再生します。<br>ここでの再生は抽選結果・当選履歴・年間予算・支給履歴に<b>一切記録されません</b>。</div>
  <div class="grid">
    <button class="pbtn b1" data-prize="cash:1000">1,000円<small>青 / LUCKY</small></button>
    <button class="pbtn b2" data-prize="cash:2000">2,000円<small>ゴールド</small></button>
    <button class="pbtn b3" data-prize="cash:3000">3,000円<small>エメラルド</small></button>
    <button class="pbtn b5" data-prize="cash:5000">5,000円<small>赤 / 閃光</small></button>
    <button class="pbtn b10" data-prize="cash:10000">10,000円<small>レインボー</small></button>
    <button class="pbtn bh" data-prize="hotel:0">高級ホテル宿泊券<small>黒×金 JACKPOT</small></button>
  </div>
  <div class="foot">※このページは演出確認専用です。実際のラッキー賞機能(抽選・履歴・管理)は本番反映後に社員ポータル内で動作します。</div>
</div>

<div id="lucky-overlay" class="lucky-overlay" style="display:none;">
  <div class="lucky-confetti" id="lucky-confetti"></div>
  <div class="lucky-stage" id="lucky-stage">
    <div class="lucky-badge" id="lucky-badge">LUCKY</div>
    <div class="lucky-amount" id="lucky-amount"></div>
    <div class="lucky-winner" id="lucky-winner"></div>
    <div class="lucky-sub" id="lucky-sub"></div>
  </div>
  <button type="button" class="lucky-close" id="lucky-close">閉じる</button>
</div>

<script>
var LUCKY_CONFETTI_COLORS={blue:['#5aa0ff','#a7c8ff','#ffffff','#2f6bd6'],gold:['#ffd76e','#ffb800','#fff3c4','#c9a227'],green:['#4dffb0','#0fe08a','#c9ffe8','#0a9e6e'],red:['#ff5a6a','#ff2038','#ffd0d5','#ffffff'],rainbow:['#ff004c','#ff8a00','#ffe600','#22d36b','#00b3ff','#8a2be2'],hotel:['#f5d76e','#c9a227','#fff3c4','#ffffff']};
function luckyConfetti(theme,count){var wrap=document.getElementById('lucky-confetti');var colors=LUCKY_CONFETTI_COLORS[theme]||LUCKY_CONFETTI_COLORS.blue;for(var i=0;i<count;i++){var p=document.createElement('div');p.className='lucky-piece';p.style.left=(Math.random()*100)+'vw';p.style.background=colors[i%colors.length];p.style.animationDuration=(1.6+Math.random()*1.8)+'s';p.style.animationDelay=(Math.random()*0.6)+'s';p.style.transform='rotate('+(Math.random()*360)+'deg)';if(Math.random()<0.3)p.style.borderRadius='50%';wrap.appendChild(p);}}
var luckyAnimTimers=[];function luckyClearTimers(){luckyAnimTimers.forEach(function(t){clearTimeout(t);});luckyAnimTimers=[];}
function luckyAfter(ms,fn){luckyAnimTimers.push(setTimeout(fn,ms));}
function playLuckyAnimation(opts){var ov=document.getElementById('lucky-overlay');var stage=document.getElementById('lucky-stage');var confetti=document.getElementById('lucky-confetti');luckyClearTimers();confetti.innerHTML='';ov.className='lucky-overlay theme-'+opts.theme;ov.style.display='flex';document.getElementById('lucky-badge').textContent=opts.theme==='hotel'?'SPECIAL JACKPOT':'LUCKY';document.getElementById('lucky-amount').textContent=opts.prizeLabel;document.getElementById('lucky-winner').textContent=opts.winnerName?(opts.winnerName+' さん'):'';document.getElementById('lucky-sub').textContent=opts.sub||'';
var ring=ov.querySelector('.lucky-ring');if(!ring){ring=document.createElement('div');ring.className='lucky-ring';ov.appendChild(ring);}
var flash=ov.querySelector('.lucky-flash');if(!flash){flash=document.createElement('div');flash.className='lucky-flash';ov.appendChild(flash);}flash.className='lucky-flash';
var doors=ov.querySelector('.lucky-doors');if(doors)doors.remove();stage.style.visibility='visible';
var doFlash=function(){flash.className='lucky-flash go';};
if(opts.theme==='blue'){luckyConfetti('blue',40);}
else if(opts.theme==='gold'){luckyConfetti('gold',70);}
else if(opts.theme==='green'){luckyConfetti('green',80);}
else if(opts.theme==='red'){stage.style.visibility='hidden';ov.classList.add('dim');luckyAfter(500,function(){ov.classList.remove('dim');ov.className='lucky-overlay theme-red';doFlash();stage.style.visibility='visible';luckyConfetti('red',120);});}
else if(opts.theme==='rainbow'){document.getElementById('lucky-amount').textContent='？';document.getElementById('lucky-winner').textContent='';luckyAfter(900,function(){ov.classList.add('dim');stage.style.visibility='hidden';});luckyAfter(1500,function(){ov.classList.remove('dim');ov.className='lucky-overlay theme-rainbow';doFlash();stage.style.visibility='visible';document.getElementById('lucky-amount').textContent=opts.prizeLabel;document.getElementById('lucky-winner').textContent=opts.winnerName?(opts.winnerName+' さん'):'';luckyConfetti('rainbow',180);});}
else if(opts.theme==='hotel'){stage.style.visibility='hidden';var dd=document.createElement('div');dd.className='lucky-doors';dd.innerHTML='<div class="lucky-door l"></div><div class="lucky-door r"></div>';ov.appendChild(dd);luckyAfter(600,function(){dd.classList.add('open');});luckyAfter(1500,function(){dd.remove();doFlash();stage.style.visibility='visible';luckyConfetti('hotel',120);});}
}
function closeLuckyOverlay(){luckyClearTimers();var ov=document.getElementById('lucky-overlay');ov.style.display='none';ov.className='lucky-overlay';document.getElementById('lucky-confetti').innerHTML='';}
document.getElementById('lucky-close').addEventListener('click',closeLuckyOverlay);
document.querySelectorAll('.pbtn').forEach(function(btn){btn.addEventListener('click',function(){var parts=btn.getAttribute('data-prize').split(':');var type=parts[0];var amount=Number(parts[1]);var theme=type==='hotel'?'hotel':(amount>=10000?'rainbow':amount>=5000?'red':amount>=3000?'green':amount>=2000?'gold':'blue');var label=type==='hotel'?'高級ホテル宿泊券':amount.toLocaleString('ja-JP')+'円';playLuckyAnimation({theme:theme,prizeLabel:label,winnerName:'テスト 太郎',sub:'演出プレビュー'});});});
</script>
</body>
</html>
