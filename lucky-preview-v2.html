<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ラッキー賞 先行確認</title>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#080d18;color:#f3eee2}main{max-width:800px;margin:auto;padding:32px 20px}h1{color:#edcf96}.panel{background:#151c2a;padding:22px;border:1px solid #55482f;border-radius:14px;margin:20px 0}label{display:block;padding:12px 0;line-height:1.6}select,button{font:inherit;padding:12px;background:#f0d59f;color:#251b0c;border:0;border-radius:6px;margin:6px}input{width:20px;height:20px;vertical-align:middle;margin-right:10px}small,p{line-height:1.8}#home-lucky-card{display:none}.note{color:#cabd9f}.approve-btn{font-weight:bold}</style>
<main><p>迅翔興業 社員ポータル · 先行確認</p><h1>ラッキー賞</h1><p class="note">動作確認用です。実際の社員情報・抽選・賞金には接続しません。</p>
<section class="panel"><h2>抽選ボタンの表示を確認</h2><label><input type="checkbox" id="offYesterday">昨日は休み</label><label><input type="checkbox" id="yesterday" checked>昨日の日報を提出済み</label><label><input type="checkbox" id="today">今日の自分の日報を提出済み</label><label><input type="checkbox" id="outside1">同じ現場の外注さん①が提出済み</label><label><input type="checkbox" id="outside2">同じ現場の外注さん②が提出済み</label><p>例：自分＋外注さん2人。最後の1人が提出すると抽選ボタンが出ます。</p><button id="home-lucky-card"></button><button id="reset">確認をやり直す</button></section>
<section class="panel"><h2>賞品・演出の確認</h2><label>賞品 <select id="prize"><option value="blue">1,000円</option><option value="green">2,000円</option><option value="red">3,000円</option><option value="gold" selected>5,000円</option><option value="rainbow">10,000円</option><option value="hotel">高級ホテル宿泊券</option><option value="miss">ハズレ</option></select></label><label>演出 <select id="mode"><option value="normal">通常</option><option value="revival">復活</option><option value="upgrade">昇格</option><option value="goldhint">金の点</option><option value="delay">音の遅れ</option><option value="silent">突然のホテル賞</option></select></label><button id="preview">演出を見る</button><p>年間設定：2,000円×20回／3,000円×10回／5,000円×5回／10,000円×5回／ホテル×2回。通常は1,000円。</p></section>
</main><script src="./lucky-v2.js"></script><script>
const $=id=>document.getElementById(id);let claimed=null;
function state(){const reasons=[];if(!$('offYesterday').checked&&!$('yesterday').checked)reasons.push('yesterday_report');if(!$('today').checked)reasons.push('today_report');if(!$('outside1').checked||!$('outside2').checked)reasons.push('subcontractor_reports');return {version:2,enabled:true,date:'確認用',state:claimed?'claimed':reasons.length?'waiting':'ready',reasons,result:claimed};}
function result(){return {won:$('prize').value!=='miss',theme:$('prize').value==='miss'?'blue':$('prize').value};}
function mount(){LuckyV2.mountHome({employeeCode:'DEMO',isCurrent:()=>true,rpc:async name=>{if(name==='lucky_v2_status')return state();if(state().state!=='ready'&&!claimed)throw Error('not ready');return claimed||(claimed=result());}});}
document.querySelectorAll('input').forEach(el=>el.addEventListener('change',mount));$('reset').onclick=()=>{claimed=null;mount();};$('preview').onclick=()=>{let theme=$('prize').value,mode=$('mode').value;if(mode==='silent')theme='hotel';if(mode==='upgrade'&&(theme==='blue'||theme==='miss'))theme='gold';if(mode==='revival'&&theme==='miss')theme='gold';LuckyV2.show({won:theme!=='miss',theme:theme==='miss'?'blue':theme},true,mode);};mount();
</script></html>
